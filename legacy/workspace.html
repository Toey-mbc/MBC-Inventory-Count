@media(max-width:900px){.report-filter-grid-modern{grid-template-columns:repeat(2,minmax(0,1fr))}.report-filter-search,.report-filter-buttons{grid-column:span 2}.report-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.report-table-wrap-modern{max-height:none}.report-result-head{align-items:flex-start}}
@media(max-width:560px){.report-filter-grid-modern{grid-template-columns:1fr}.report-filter-search,.report-filter-buttons{grid-column:span 1}.report-filter-buttons{display:grid;grid-template-columns:1fr 1fr}.report-kpis{grid-template-columns:1fr 1fr}.report-kpi strong{font-size:21px}.report-tabs-modern button{padding:9px 11px}.report-filter-note{display:block}.report-filter-note span{display:block;margin-top:4px}}

.print-only{display:none}

@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;top:0;width:264px;transition:.25s;box-shadow:10px 0 35px rgba(0,0,0,.25)}.sidebar.open{left:0}.hamb{display:inline-flex}.content{padding:16px}.topbar{padding:0 14px}.topbar h2{font-size:17px}.sync-chip{display:none}.two-col,.settings-grid,.master-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.user-switch{max-width:150px}.audit-item{grid-template-columns:1fr 1fr}.audit-item .detail{grid-column:1/-1}.scan-buttons{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpi-grid,.three-col,.filters,.form-grid{grid-template-columns:1fr}.page-head{display:block}.page-head .actions{margin-top:12px}.top-actions .icon-btn{display:none}.scan-context{grid-template-columns:1fr 1fr}.barcode-box input{font-size:19px}.last-product{align-items:flex-start}.last-product .qty{font-size:24px}.scan-buttons{grid-template-columns:1fr 1fr}.content{padding:12px}.card{padding:14px}.modal{padding:8px}.modal-head,.modal-body,.modal-foot{padding-left:14px;padding-right:14px}.audit-item{grid-template-columns:1fr}.audit-item .detail{grid-column:auto}}

function uid(prefix='ID'){return `${prefix}-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`}
function nowISO(){return new Date().toISOString()}
function fmtDate(v,withTime=false){if(!v)return '-';const d=new Date(v);if(Number.isNaN(d.getTime()))return v;return new Intl.DateTimeFormat('th-TH',withTime?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'}).format(d)}
function fmtNum(v,d=0){return Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function deepClone(o){return JSON.parse(JSON.stringify(o))}
function hashString(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
function sum(arr,fn=x=>x){return arr.reduce((a,x)=>a+Number(fn(x)||0),0)}
function byId(arr,id){return arr.find(x=>x.id===id)}
function currentUser(){return runtimeUser||byId(state?.users||[],state?.currentUserId)||(state?.users||[])[0]||{id:'',name:'ผู้ใช้งาน',role:'read',accessMode:'read',isAdmin:false,active:true}}
function can(action){
 const admin=runtimeIsAdmin||currentUser()?.isAdmin||currentUser()?.role==='admin';
 const edit=admin||runtimeAccessMode==='edit'||currentUser()?.accessMode==='edit';
 if(['manageUsers','clearData','manageSystem','restoreBackup','factoryReset'].includes(action))return admin;
 if(['manageMaster','approve','createRound','editAnyCount','transferApprove','stockAdjust','reopen','scan'].includes(action))return edit;
 return true
}
function warehouseName(id){return byId(state.warehouses,id)?.name||'-'}
function locationName(id){return byId(state.locations,id)?.name||'-'}
function conditionName(id){return byId(state.conditions,id)?.name||'-'}
function productName(id){const p=byId(state.products,id);return p?`${p.sku} · ${p.name}`:'-'}
function userName(id){return byId(state.users,id)?.name||'-'}
function brandName(id){return byId(state.brands,id)?.name||'-'}

function keyOf(productId,warehouseId,locationId,conditionId){return [productId,warehouseId,locationId,conditionId].join('|')}
function parseKey(k){const [productId,warehouseId,locationId,conditionId]=k.split('|');return{productId,warehouseId,locationId,conditionId}}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function slug(v){return String(v||'file').replace(/[^a-zA-Z0-9ก-๙_-]+/g,'_').replace(/^_+|_+$/g,'')}
function dateInput(v){return v?new Date(v).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}
function toBool(v){return v===true||v===1||['true','yes','y','1','ใช่','active','เปิด'].includes(norm(v))}
function csvEscape(v){v=String(v??'');return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows}
function objectFromRows(rows){if(!rows.length)return[];const headers=rows[0].map(x=>String(x).trim());return rows.slice(1).filter(r=>r.some(x=>String(x).trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}

function migrateState(s){

function buildSystemBaseline(warehouseIds){return Object.entries(state.stockBalances||{}).filter(([key])=>warehouseIds.includes(parseKey(key).warehouseId)).reduce((acc,[key,qty])=>{const n=Number(qty||0);if(n>=0)acc[key]=n;return acc},{})}
function baselineObjectToRows(snapshot){return Object.entries(snapshot||{}).map(([key,quantity])=>{const z=parseKey(key),p=byId(state.products,z.productId),w=byId(state.warehouses,z.warehouseId),l=byId(state.locations,z.locationId),c=byId(state.conditions,z.conditionId);return{barcode:p?.barcodes?.[0]||'',sku:p?.sku||'',productName:p?.name||'',warehouseCode:w?.code||'',warehouseName:w?.name||'',locationCode:l?.code||'',locationName:l?.name||'',condition:c?.name||'',quantity:Number(quantity||0)}})}

async function parseRoundBaselineFile(file,warehouseIds){
 const sheets=await readTabularFile(file),first=Object.values(sheets)[0]||[],objects=objectFromRows(first),snapshot={},errors=[];
 if(!objects.length)throw new Error('ไฟล์ไม่มีข้อมูลสำหรับนำเข้า');
 objects.forEach((row,index)=>{
  const line=index+2;
  const barcode=String(headerVal(row,['Barcode','บาร์โค้ด'])).trim();
  const sku=String(headerVal(row,['SKU','รหัสสินค้า','Product Code'])).trim();
  const whCode=String(headerVal(row,['Warehouse Code','คลัง','รหัสคลัง','Warehouse'])).trim();
  const locCode=String(headerVal(row,['Location Code','โลเคชั่น','รหัสโลเคชั่น','Location'])).trim();
  const condText=String(headerVal(row,['Condition','สภาพ','สภาพสินค้า'])).trim();
  const qtyRaw=headerVal(row,['Quantity','Qty','จำนวน','System Quantity','จำนวนตามระบบ']);
  const qty=Number(qtyRaw);
  const product=(barcode&&productByBarcode(barcode))||state.products.find(p=>norm(p.sku)===norm(sku));
  const warehouse=state.warehouses.find(w=>norm(w.code)===norm(whCode)||norm(w.name)===norm(whCode));
  const location=state.locations.find(l=>(!warehouse||l.warehouseId===warehouse.id)&&(norm(l.code)===norm(locCode)||norm(l.name)===norm(locCode)));
  const condition=condText?state.conditions.find(c=>norm(c.name)===norm(condText)||norm(c.id)===norm(condText)):state.conditions[0];
  if(!product)errors.push(`แถว ${line}: ไม่พบสินค้า Barcode/SKU`);
  if(!warehouse)errors.push(`แถว ${line}: ไม่พบคลัง ${whCode||'-'}`);
  else if(!warehouseIds.includes(warehouse.id))errors.push(`แถว ${line}: คลัง ${warehouse.code} ไม่ได้ถูกเลือกในรอบ`);
  if(!location)errors.push(`แถว ${line}: ไม่พบโลเคชั่น ${locCode||'-'}`);
  if(!condition)errors.push(`แถว ${line}: ไม่พบสภาพสินค้า ${condText||'-'}`);
  if(!Number.isFinite(qty)||qty<0||!Number.isInteger(qty))errors.push(`แถว ${line}: จำนวนต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป`);
  if(product&&warehouse&&location&&condition&&warehouseIds.includes(warehouse.id)&&Number.isInteger(qty)&&qty>=0){
   const key=keyOf(product.id,warehouse.id,location.id,condition.id);snapshot[key]=(snapshot[key]||0)+qty;
  }
 });
 if(errors.length)throw new Error(errors.slice(0,12).join('\n')+(errors.length>12?`\nและอีก ${errors.length-12} รายการ`:''));
 if(!Object.keys(snapshot).length)throw new Error('ไม่พบรายการที่สามารถนำเข้าได้');
 return{snapshot,fileName:file.name,rowCount:Object.keys(snapshot).length,totalQty:sum(Object.values(snapshot)),previewRows:baselineObjectToRows(snapshot).slice(0,8)};
}

function openResolveUnknown(id){hideUnknownAlert();const u=byId(state.unknowns,id);if(!u)return;showModal({title:'ตรวจสอบบาร์โค้ดไม่พบ',subtitle:`${u.barcode} · จำนวน ${u.qty} ชิ้น`,wide:true,body:`<div class="banner error"><div><b>${esc(u.barcode)}</b><small>${esc(roundById(u.roundId)?.name||'')} · ${esc(warehouseName(u.warehouseId))} / ${esc(locationName(u.locationId))} / ${esc(conditionName(u.conditionId))}</small></div>${statusBadge('รายการค้าง','st-error')}</div><div class="tabs"><button class="tab-btn active" data-unknown-tab="link">ผูกกับสินค้าที่มีอยู่</button><button class="tab-btn" data-unknown-tab="create">เพิ่มสินค้าใหม่</button><button class="tab-btn" data-unknown-tab="ignore">ข้ามรายการ</button></div><div id="unknownResolvePane">${unknownLinkPane(u)}</div>`,foot:`<button class="btn btn-outline" data-close-modal>ปิด</button><button class="btn btn-primary" id="unknownResolveSubmit">ยืนยันการผูกสินค้า</button>`,onOpen:()=>setupUnknownResolve(u,'link')})}

  title:'ปรับยอดสต๊อกด้วยมือ',

   const wh=document.getElementById('saWarehouse'),loc=document.getElementById('saLocation');

function validateProductInput(d,id){if(!d.sku||!d.name)return 'กรุณากรอก SKU และชื่อสินค้า';const skuDup=state.products.find(p=>p.id!==id&&norm(p.sku)===norm(d.sku));if(skuDup)return `SKU ${d.sku} มีอยู่แล้ว`;const bars=(d.barcodes||[]).map(x=>String(x).trim()).filter(Boolean);if(!bars.length)return 'ต้องมีบาร์โค้ดอย่างน้อย 1 รหัส';if(new Set(bars.map(norm)).size!==bars.length)return 'มีบาร์โค้ดซ้ำภายในสินค้า';for(const b of bars){const dup=state.products.find(p=>p.id!==id&&(p.barcodes||[]).some(x=>norm(x)===norm(b)));if(dup)return `บาร์โค้ด ${b} ถูกใช้กับ ${dup.sku} แล้ว`}return ''}

async function saveProductForm(id){const d={sku:document.getElementById('pfSku').value.trim(),model:document.getElementById('pfModel').value.trim(),name:document.getElementById('pfName').value.trim(),barcodes:document.getElementById('pfBarcodes').value.split(/\r?\n|,/).map(x=>x.trim()).filter(Boolean),brandId:document.getElementById('pfBrand').value,categoryId:document.getElementById('pfCategory').value,unit:document.getElementById('pfUnit').value.trim()||'ชิ้น',cost:Number(document.getElementById('pfCost').value||0),status:document.getElementById('pfStatus').value,image:window._productImage||'',notes:document.getElementById('pfNotes').value.trim()};const err=validateProductInput(d,id);if(err)return toast(err,'error');await mutate({auditAction:id?'UPDATE_PRODUCT':'CREATE_PRODUCT',auditDetail:`${d.sku} · ${d.name}`,entityType:'product',entityId:id||''},()=>{if(id)Object.assign(byId(state.products,id),d);else state.products.unshift({id:uid('PRD'),...d})});closeModal();toast('บันทึกสินค้าแล้ว','success')}
async function compressImage(file,maxW,maxH,quality){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const ratio=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=url})}

function openMasterForm(type,id=null,targetSelect=null){const singular={brands:'แบรนด์',categories:'หมวดหมู่',warehouses:'คลังสินค้า',locations:'โลเคชั่น',conditions:'สภาพสินค้า'}[type];const arr=state[type],x=id?deepClone(byId(arr,id)):{};let body='';if(type==='brands'||type==='categories')body=`<div class="field"><label>ชื่อ${singular} *</label><input id="mfName" value="${esc(x.name||'')}"></div><div class="setting-row"><div><b>เปิดใช้งาน</b></div><label class="switch"><input id="mfActive" type="checkbox" ${x.active!==false?'checked':''}><span class="slider"></span></label></div>`;if(type==='warehouses')body=`<div class="form-grid"><div class="field"><label>รหัสคลัง *</label><input id="mfCode" value="${esc(x.code||'')}"></div><div class="field"><label>ชื่อคลัง *</label><input id="mfName" value="${esc(x.name||'')}"></div></div><div class="setting-row"><div><b>เปิดใช้งาน</b></div><label class="switch"><input id="mfActive" type="checkbox" ${x.active!==false?'checked':''}><span class="slider"></span></label></div>`;if(type==='locations')body=`<div class="form-grid"><div class="field"><label>รหัสโลเคชั่น *</label><input id="mfCode" value="${esc(x.code||'')}"></div><div class="field"><label>ชื่อโลเคชั่น *</label><input id="mfName" value="${esc(x.name||'')}"></div><div class="field"><label>คลัง *</label><select id="mfWarehouse">${options(state.warehouses,x.warehouseId||'')}</select></div><div class="field"><label>สภาพเริ่มต้น *</label><select id="mfCondition">${options(state.conditions,x.defaultConditionId||'')}</select></div><div class="field full"><label>บาร์โค้ดโลเคชั่น *</label><input id="mfBarcode" value="${esc(x.barcode||'')}" placeholder="เช่น LOC:A-01"><div class="hint">ยิงรหัสนี้ในหน้าตรวจนับเพื่อเปลี่ยนโลเคชั่นอัตโนมัติ</div></div><div class="field full"><label>หมายเหตุ</label><textarea id="mfNotes">${esc(x.notes||'')}</textarea></div></div><div class="setting-row"><div><b>เปิดใช้งาน</b></div><label class="switch"><input id="mfActive" type="checkbox" ${x.active function printLocationLabel(id){const l=byId(state.locations,id);if(!l)return;const svg=code39Svg(l.barcode,2,80);const w=window.open('','_blank','width=800,height=600');w.document.write(`<html><head><title>${esc(l.code)}</title><style>body{font-family:Arial;text-align:center;padding:35px}.label{border:2px solid #222;padding:25px;display:inline-block}.logo{font-weight:900;font-size:28px;color:#ed7628}.code{font-size:38px;font-weight:900;margin:10px}.name{font-size:23px;margin-bottom:18px}@media print{button{display:none}}

function code39Svg(text,scale=2,height=60){const map={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};const chars=`*${String(text).toUpperCase()}*`;let x=10,bars='';for(const ch of chars){const pat=map[ch]||map['-'];for(let i=0;i<9;i++){const w=(pat[i]==='w'?3:1)*scale;if(i%2===0)bars+=`<rect x="${x}" y="5" width="${w}" height="${height}" fill="#111"/>`;x+=w}x+=scale*2}return `<svg xmlns="http://www.w3.org/2000/svg" width="${x+10}" height="${height+10}" viewBox="0 0 ${x+10} ${height+10}">${bars}</svg>`}

function openUserForm(id=null){const u=id?deepClone(byId(state.users,id)):{name:'',email:'',role:'counter',warehouseIds:[],active:true};showModal({title:id?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งาน',body:`<div class="form-grid"><div class="field"><label>ชื่อ *</label><input id="ufName" value="${esc(u.name)}"></div><div class="field"><label>อีเมล</label><input id="ufEmail" type="email" value="${esc(u.email||'')}"></div><div class="field"><label>บทบาท *</label><select id="ufRole"><option value="admin" ${u.role==='admin'?'selected':''}>ผู้ดูแลระบบ</option><option value="supervisor" ${u.role==='supervisor'?'selected':''}>หัวหน้าคลัง</option><option value="counter" ${u.role==='counter'?'selected':''}>ผู้ตรวจนับ</option></select></div><div class="field full"><label>คลังที่รับผิดชอบ</label><div class="master-grid">${state.warehouses.map(w=>`<label class="master-item"><span><b>${esc(w.name)}</b><small>${esc(w.code)}</small></span><input type="checkbox" name="ufWh" value="${w.id}" ${u.warehouseIds.includes(w.id)?'checked':''}></label>`).join('')}</div></div></div><div class="setting-row"><div><b>เปิดใช้งาน</b></div><label class="switch"><input id="ufActive" type="checkbox" ${u.active?'checked':''}><span class="slider"></span></label></div>`,foot:`<button class="btn btn-outline" data-close-modal>ยกเลิก</button><button class="btn btn-primary" id="ufSave">บันทึก</button>`,onOpen:()=>document.getElementById('ufSave').onclick=()=>saveUser(id)})}
async function saveUser(id){const d={name:document.getElementById('ufName').value.trim(),email:document.getElementById('ufEmail').value.trim(),role:document.getElementById('ufRole').value,warehouseIds:[...document.querySelectorAll('[name=ufWh]:checked')].map(x=>x.value),active:document.getElementById('ufActive').checked};if(!d.name)return toast('กรุณากรอกชื่อ','error');if(d.email&&state.users.some(u=>u.id!==id&&norm(u.email)===norm(d.email)))return toast('อีเมลนี้มีอยู่แล้ว','error');await mutate({auditAction:id?'UPDATE_USER':'CREATE_USER',auditDetail:d.name,entityType:'user',entityId:id||''},()=>{if(id)Object.assign(byId(state.users,id),d);else state.users.push({id:uid('USR'),...d})});closeModal();toast('บันทึกผู้ใช้งานแล้ว','success')}
async function toggleUser(id){if(id===state.currentUserId)return toast('ไม่สามารถปิดผู้ใช้ที่กำลังใช้งานอยู่','error');const u=byId(state.users,id);await mutate({auditAction:'TOGGLE_USER',auditDetail:u.name,entityType:'user',entityId:id},()=>u.active=!u.active);toast('อัปเดตสถานะผู้ใช้งานแล้ว','success')}

function reportPrimaryBarcode(p){return (p?.barcodes||[])[0]||'-'}
function reportProductDescription(p){const notes=String(p?.notes||'').trim();if(notes)return notes;const parts=[p?.model,categoryName(p?.categoryId)].filter(x=>x&&x!=='-');return parts.join(' · ')||'-'}
function reportFilterState(){return {q:'',brandId:'',warehouseId:'',locationId:'',conditionId:'',sort:'warehouse',...(window._reportFilter||{})}}
function reportBaseRows(roundId){const r=roundById(roundId);if(!r)return[];return roundRows(roundId).map(x=>{const p=byId(state.products,x.productId)||{},w=byId(state.warehouses,x.warehouseId)||{},l=byId(state.locations,x.locationId)||{};return{key:x.key,productId:x.productId,brandId:p.brandId||'',barcode:reportPrimaryBarcode(p),barcodes:p.barcodes||[],sku:p.sku||'-',productName:p.name||'-',description:reportProductDescription(p),brand:brandName(p.brandId),model:p.model||'',warehouseId:x.warehouseId,warehouseCode:w.code||'-',warehouseName:w.name||'-',locationId:x.locationId,locationCode:l.code||'-',locationName:l.name||'-',conditionId:x.conditionId,conditionName:conditionName(x.conditionId),systemQty:Number(x.systemQty||0),countedQty:Number(x.countedQty||0),diff:Number(x.diff||0),status:x.status,statusText:statusTextResult(x.status)}})}
function reportSortRows(rows,sort){const out=[...rows],thai=(a,b)=>String(a||'').localeCompare(String(b||''),'th');if(sort==='brand')out.sort((a,b)=>thai(a.brand,b.brand)||thai(a.sku,b.sku)||thai(a.warehouseCode,b.warehouseCode)||thai(a.locationCode,b.locationCode));else if(sort==='sku')out.sort((a,b)=>thai(a.sku,b.sku)||thai(a.warehouseCode,b.warehouseCode)||thai(a.locationCode,b.locationCode));else if(sort==='counted_desc')out.sort((a,b)=>b.countedQty-a.countedQty||thai(a.sku,b.sku));else if(sort==='variance_desc')out.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)||thai(a.sku,b.sku));else out.sort((a,b)=>thai(a.warehouseCode,b.warehouseCode)||thai(a.locationCode,b.locationCode)||thai(a.sku,b.sku));return out}
function reportFilteredDetailRows(roundId){const f=reportFilterState(),q=norm(f.q);return reportSortRows(reportBaseRows(roundId).filter(x=>(!f.brandId||x.brandId===f.brandId)&&(!f.warehouseId||x.warehouseId===f.warehouseId)&&(!f.locationId||x.locationId===f.locationId)&&(!f.conditionId||x.conditionId===f.conditionId)&&(!q||norm([x.barcode,x.barcodes.join(' '),x.sku,x.productName,x.description,x.brand,x.model,x.warehouseCode,x.warehouseName,x.locationCode,x.locationName,x.conditionName].join(' ')).includes(q))),f.sort)}
function reportSkuWarehouseRows(detail){const map=new Map();detail.forEach(x=>{const k=`${x.productId}|${x.warehouseId}`,cur=map.get(k)||{key:k,productId:x.productId,brandId:x.brandId,brand:x.brand,barcode:x.barcode,barcodes:x.barcodes,sku:x.sku,productName:x.productName,description:x.description,warehouseId:x.warehouseId,warehouseCode:x.warehouseCode,warehouseName:x.warehouseName,locationIds:new Set(),conditionIds:new Set(),systemQty:0,countedQty:0,diff:0};cur.locationIds.add(x.locationId);cur.conditionIds.add(x.conditionId);cur.systemQty+=x.systemQty;cur.countedQty+=x.countedQty;cur.diff=cur.countedQty-cur.systemQty;map.set(k,cur)});return reportSortRows([...map.values()].map(x=>({...x,locationCount:x.locationIds.size,conditionCount:x.conditionIds.size})),reportFilterState().sort)}
function reportWarehouseRows(detail){const map=new Map();detail.forEach(x=>{const cur=map.get(x.warehouseId)||{warehouseId:x.warehouseId,warehouseCode:x.warehouseCode,warehouseName:x.warehouseName,productIds:new Set(),brandIds:new Set(),locationIds:new Set(),systemQty:0,countedQty:0,diff:0};cur.productIds.add(x.productId);if(x.brandId)cur.brandIds.add(x.brandId);cur.locationIds.add(x.locationId);cur.systemQty+=x.systemQty;cur.countedQty+=x.countedQty;cur.diff=cur.countedQty-cur.systemQty;map.set(x.warehouseId,cur)});return [...map.values()].map(x=>({...x,skuCount:x.productIds.size,brandCount:x.brandIds.size,locationCount:x.locationIds.size,progress:x.systemQty?Math.min(100,Math.round(x.countedQty/x.systemQty*100)):0})).sort((a,b)=>a.warehouseCode.localeCompare(b.warehouseCode))}
function reportHistoryRows(){const q=norm(reportFilterState().q);return state.rounds.map(x=>{const s=roundStats(x.id);return{id:x.id,name:x.name,startDate:x.startDate,status:x.status,assignees:x.assigneeIds.map(userName).join(', '),exact:s.exact,short:s.short,over:s.over,uncounted:s.uncounted,approvedBy:x.approvedBy?userName(x.approvedBy):'-'}}).filter(x=>!q||norm(`${x.name} ${ROUND_LABEL[x.status]} ${x.assignees}`).includes(q))}
function reportRows(type,roundId){const detail=reportFilteredDetailRows(roundId);if(type==='inventory')return detail;if(type==='sku')return reportSkuWarehouseRows(detail);if(type==='warehouse')return reportWarehouseRows(detail);if(type==='variance')return detail.filter(x=>x.diff!==0&&x.status!=='uncounted');if(type==='uncounted')return detail.filter(x=>x.status==='uncounted');if(type==='history')return reportHistoryRows();return detail}
function reportStats(roundId){const rows=reportFilteredDetailRows(roundId);return{rows,system:sum(rows,x=>x.systemQty),counted:sum(rows,x=>x.countedQty),diff:sum(rows,x=>x.diff),skuCount:new Set(rows.map(x=>x.productId)).size,brandCount:new Set(rows.map(x=>x.brandId).filter(Boolean)).size,locationCount:new Set(rows.map(x=>x.locationId)).size}}
function reportTypeTitle(type){return{inventory:'รายละเอียดสินค้า',sku:'สรุป SKU × คลัง',warehouse:'สรุปตามคลัง',variance:'สินค้าขาดหรือเกิน',uncounted:'สินค้ายังไม่ได้นับ',history:'ประวัติการตรวจนับ'}[type]||'รายละเอียดสินค้า'}
function reportDiffHtml(value){const cls=value>0?'diff-pos':value<0?'diff-neg':'diff-zero',prefix=value>0?'+':'';return `<span class="${cls}">${prefix}${fmtNum(value)}</span>`}
function reportStatusHtml(status){const cls={exact:'st-approved',short:'st-error',over:'st-info',uncounted:'st-pending',outside:'st-recount'}[status]||'st-disabled';return statusBadge(statusTextResult(status),cls)}
function reportDetailTable(rows){return `<div class="table-wrap report-table-wrap-modern"><table class="report-table-modern"><thead><tr><th>บาร์โค้ด</th><th>SKU</th><th>แบรนด์</th><th>ชื่อสินค้า / รายละเอียด</th><th>คลัง</th><th>โลเคชั่น</th><th>สภาพ</th><th class="num">ตามระบบ</th><th class="num">นับได้</th><th class="num">ผลต่าง</th><th>สถานะ</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><span class="report-barcode">${esc(x.barcode)}</span>${x.barcodes.length>1?`<span class="report-barcode-more">รวม ${x.barcodes.length} บาร์โค้ด</span>`:''}</td><td><span class="report-sku-code">${esc(x.sku)}</span></td><td><span class="report-brand-pill">${esc(x.brand)}</span></td><td><div class="report-product-cell"><b>${esc(x.productName)}</b><small>${esc(x.description)}</small></div></td><td><div class="report-place-cell"><b>${esc(x.warehouseCode)}</b><small>${esc(x.warehouseName)}</small></div></td><td><div class="report-place-cell"><b>${esc(x.locationCode)}</b><small>${esc(x.locationName)}</small></div></td><td><span class="report-condition-pill">${esc(x.conditionName)}</span></td><td class="report-qty">${fmtNum(x.systemQty)}</td><td class="report-qty">${fmtNum(x.countedQty)}</td><td class="report-diff">${reportDiffHtml(x.diff)}</td><td class="report-status-cell">${reportStatusHtml(x.status)}</td></tr>`).join(''):`<tr><td colspan="11" class="report-empty">ไม่พบสินค้าในเงื่อนไขที่เลือก</td></tr>`}</tbody></table></div>`}
function reportSkuTable(rows){return `<div class="table-wrap report-table-wrap-modern"><table class="report-table-modern"><thead><tr><th>บาร์โค้ด</th><th>SKU</th><th>แบรนด์</th><th>ชื่อสินค้า / รายละเอียด</th><th>คลัง</th><th class="num">โลเคชั่น</th><th class="num">ตามระบบ</th><th class="num">นับได้</th><th class="num">ผลต่าง</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><span class="report-barcode">${esc(x.barcode)}</span></td><td><span class="report-sku-code">${esc(x.sku)}</span></td><td><span class="report-brand-pill">${esc(x.brand)}</span></td><td><div class="report-product-cell"><b>${esc(x.productName)}</b><small>${esc(x.description)}</small></div></td><td><div class="report-place-cell"><b>${esc(x.warehouseCode)}</b><small>${esc(x.warehouseName)}</small></div></td><td class="report-qty">${fmtNum(x.locationCount)}</td><td class="report-qty">${fmtNum(x.systemQty)}</td><td class="report-qty">${fmtNum(x.countedQty)}</td><td class="report-diff">${reportDiffHtml(x.diff)}</td></tr>`).join(''):`<tr><td colspan="9" class="report-empty">ไม่พบสินค้าในเงื่อนไขที่เลือก</td></tr>`}</tbody></table></div>`}

async function commitProductImport(){
 const mode=document.getElementById('importProductMode').value,objs=window._importProducts||[],errors=[],prepared=[],seenSku=new Set(),seenBars=new Map();

  const o=objs[i],row=i+2,sku=String(headerVal(o,['SKU','รหัสสินค้า'])).trim(),name=String(headerVal(o,['Product Name','Name','ชื่อสินค้า'])).trim(),bars=String(headerVal(o,['Barcodes','Barcode','บาร์โค้ด'])).split(/[|,;\n]/).map(x=>x.trim()).filter(Boolean),brand=String(headerVal(o,['Brand','แบรนด์'])).trim(),category=String(headerVal(o,['Category','หมวดหมู่'])).trim(),model=String(headerVal(o,['Model','รุ่น'])).trim(),unit=String(headerVal(o,['Unit','หน่วย'])).trim()||'ชิ้น',cost=Number(headerVal(o,['Cost','ราคาทุน'])||0),status=norm(headerVal(o,['Status','สถานะ']))==='inactive'?'inactive':'active',notes=String(headerVal(o,['Description','รายละเอียด','Notes','หมายเหตุ'])||'');

  if(new Set(bars.map(norm)).size!==bars.length){errors.push(`แถว ${row}: มีบาร์โค้ดซ้ำภายในแถว`);continue}
  let bad=false;for(const b of bars){const nb=norm(b),owner=seenBars.get(nb);if(owner){errors.push(`แถว ${row}: บาร์โค้ด ${b} ซ้ำกับ SKU ${owner} ภายในไฟล์`);bad=true;break}const existing=state.products.find(p=>(p.barcodes||[]).some(x=>norm(x)===nb));if(existing&&norm(existing.sku)!==ns){errors.push(`แถว ${row}: บาร์โค้ด ${b} ถูกใช้กับ ${existing.sku} แล้ว`);bad=true;break}seenBars.set(nb,sku)}if(bad)continue;
  prepared.push({sku,name,bars,brand,category,model,unit,cost,status,notes});
 }
 if(errors.length)return toast(errors.slice(0,5).join(' | '),'error');
 await mutate({auditAction:'IMPORT_PRODUCTS',auditDetail:`${prepared.length} แถว · ${mode}`,entityType:'import',entityId:''},()=>{for(const d of prepared){let br=state.brands.find(x=>norm(x.name)===norm(d.brand));if(!br){br={id:uid('BRA'),name:d.brand||'ไม่ระบุ',active:true};state.brands.push(br)}let cat=state.categories.find(x=>norm(x.name)===norm(d.category));if(!cat){cat={id:uid('CAT'),name:d.category||'ไม่ระบุ',active:true};state.categories.push(cat)}let p=state.products.find(x=>norm(x.sku)===norm(d.sku));if(p&&mode==='new')continue;if(p)Object.assign(p,{barcodes:d.bars,name:d.name,model:d.model,brandId:br.id,categoryId:cat.id,unit:d.unit,cost:d.cost,status:d.status,notes:d.notes});else state.products.push({id:uid('PRD'),sku:d.sku,barcodes:d.bars,name:d.name,model:d.model,brandId:br.id,categoryId:cat.id,unit:d.unit,cost:d.cost,status:d.status,image:'',notes:d.notes})}});
 closeModal();toast(`นำเข้าสินค้า ${prepared.length} แถวแล้ว`,'success')
}

async function commitStockImport(){const mode=document.getElementById('importStockMode').value,objs=window._importStock||[],prepared=[],errors=[];objs.forEach((o,i)=>{const sku=String(headerVal(o,['SKU','รหัสสินค้า'])).trim(),wh=String(headerVal(o,['Warehouse Code','Warehouse','รหัสคลัง'])).trim(),loc=String(headerVal(o,['Location Code','Location','รหัสโลเคชั่น'])).trim(),cond=String(headerVal(o,['Condition','สภาพ'])).trim(),qty=Number(headerVal(o,['Quantity','Qty','จำนวน']));const p=state.products.find(x=>norm(x.sku)===norm(sku)),w=state.warehouses.find(x=>norm(x.code)===norm(wh)||norm(x.name)===norm(wh)),l=state.locations.find(x=>(norm(x.code)===norm(loc)||norm(x.name)===norm(loc))&&(!w||x.warehouseId===w.id)),c=state.conditions.find(x=>norm(x.name)===norm(cond));if(!p||!w||!l||!c||!Number.isFinite(qty)||qty<0)errors.push(`แถว ${i+2}: อ้างอิงข้อมูลไม่ครบหรือจำนวนไม่ถูกต้อง`);else prepared.push({key:keyOf(p.id,w.id,l.id,c.id),qty,p,w,l,c})});if(errors.length)return toast(errors.slice(0,4).join(' | '),'error');createSnapshot(false);await mutate({auditAction:'IMPORT_STOCK',auditDetail:`${prepared.length} แถว · ${mode}`,entityType:'import',entityId:''},()=>prepared.forEach(x=>state.stockBalances[x.key]=mode==='add'?Number(state.stockBalances[x.key]||0)+x.qty:x.qty));closeModal();toast(`นำเข้าสต๊อก ${prepared.length} แถวแล้ว`,'success')}
async function restoreBackupFile(file){if(!runtimeIsAdmin)return toast('เมนูนี้สำหรับผู้ดูแลระบบเท่านั้น','error');try{const obj=JSON.parse(await file.text());if(obj.format!=='MBC_INVENTORY_BACKUP'||!obj.state)throw new Error('รูปแบบไฟล์ Backup ไม่ถูกต้อง');if(obj.checksum){const actual=hashString(payloadForState(obj.state));if(actual!==obj.checksum)throw new Error('Checksum ของไฟล์ Backup ไม่ตรงกัน ไฟล์อาจไม่สมบูรณ์หรือถูกแก้ไข')}const incoming=migrateState(obj.state);confirmBox('กู้คืนข้อมูลจาก Backup',`ตรวจสอบ Checksum แล้ว · ไฟล์วันที่ ${fmtDate(obj.exportedAt,true)}`,async()=>{createSnapshot(false);state=incoming;saveState({auditAction:'RESTORE_BACKUP',auditDetail:file.name,entityType:'backup',entityId:''});closeModal();toast('ส่งข้อมูลกู้คืนไปยังฐานข้อมูลแล้ว','success')},{yes:'กู้คืนข้อมูล',danger:true})}catch(e){toast(e.message,'error')}}

async function chooseAutoBackupFile(){if(!window.showSaveFilePicker)return toast('Browser นี้ไม่รองรับ File System Access','error');try{const handle=await window.showSaveFilePicker({suggestedName:`MBC_Inventory_AutoBackup.xlsx`,types:[{description:'Excel Workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});await idbSet('autoBackupHandle',handle);await mutate({auditAction:'SET_AUTO_BACKUP_FILE',auditDetail:handle.name,entityType:'backup',entityId:''},()=>{state.meta.autoBackupFileName=handle.name;state.settings.autoExcelBackup=true});toast('เลือกไฟล์ Auto Backup แล้ว','success');await writeAutoBackup()}catch(e){if(e.name!=='AbortError')toast(e.message,'error')}}

async function writeAutoBackup(){try{const handle=await idbGet('autoBackupHandle');if(!handle)throw new Error('ไม่พบสิทธิ์ไฟล์ Auto Backup');let permission=await handle.queryPermission({mode:'readwrite'});if(permission!=='granted')permission=await handle.requestPermission({mode:'readwrite'});if(permission!=='granted')throw new Error('ไม่ได้รับอนุญาตให้เขียนไฟล์');const bytes=makeXlsx(fullBackupSheets()),writable=await handle.createWritable();await writable.write(bytes);await writable.close();state.meta.lastAutoBackupAt=nowISO();state.meta.autoBackupFileName=handle.name;const text=JSON.stringify(state);localStorage.setItem(STORAGE_KEY,text);localStorage.setItem(MIRROR_KEY,text);document.getElementById('autoBackupStatus')&&(document.getElementById('autoBackupStatus').textContent=fmtDate(state.meta.lastAutoBackupAt,true));updateSyncUi('saved');toast('อัปเดตไฟล์ Auto Backup แล้ว','success')}catch(e){updateSyncUi('error');toast(`Auto Backup ไม่สำเร็จ: ${e.message}`,'error');throw e}}

function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function beep(freq,duration,start=0,gain=.25,type='sine'){if(!state.settings.soundEnabled)return;const a=ensureAudio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,a.currentTime+start);g.gain.setValueAtTime(.0001,a.currentTime+start);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain*state.settings.volume),a.currentTime+start+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+start+duration);o.connect(g).connect(a.destination);o.start(a.currentTime+start);o.stop(a.currentTime+start+duration+.03)}
function playTone(kind){if(!state.settings.soundEnabled)return;try{ensureAudio();if(kind==='success'){beep(880,.09,0,.3,'sine');beep(1320,.12,.1,.27,'sine')}else if(kind==='location'){beep(620,.1,0,.22,'triangle');beep(920,.1,.12,.22,'triangle');beep(1220,.13,.24,.22,'triangle')}else if(kind==='adjust'){beep(520,.08,0,.2,'square');beep(420,.09,.09,.18,'square')}else if(kind==='duplicate'){beep(240,.18,0,.28,'square')}else if(kind==='unknown'){const rep=Number(state.settings.repeats||3),profile=state.settings.alarmProfile;for(let i=0;i<rep;i++){const s=i*.48;if(profile==='horn'){beep(320,.22,s,.5,'sawtooth');beep(220,.22,s+.22,.5,'sawtooth')}else if(profile==='digital'){beep(950,.1,s,.42,'square');beep(620,.1,s+.12,.42,'square');beep(950,.1,s+.24,.42,'square')}else{beep(280,.2,s,.55,'sawtooth');beep(760,.2,s+.2,.55,'sawtooth')}}if(profile==='voice'&&window.speechSynthesis)setTimeout(()=>{const u=new SpeechSynthesisUtterance('ไม่พบสินค้า รายการค้าง กรุณาตรวจสอบ');u.lang='th-TH';u.volume=Math.min(1,state.settings.volume);speechSynthesis.cancel();speechSynthesis.speak(u)},rep*480)}}catch(e){console.warn(e)}}
function startCameraScan(){if(!navigator.mediaDevices?.getUserMedia)return toast('อุปกรณ์นี้ไม่รองรับการใช้กล้อง','error');showModal({title:'สแกนด้วยกล้อง',subtitle:'รองรับ QR Code และบาร์โค้ดตามความสามารถของ Browser',body:`<div style="position:relative;background:#111;border-radius:14px;overflow:hidden;min-height:320px"><video id="cameraVideo" playsinline autoplay style="width:100%;height:420px;object-fit:cover"></video><div style="position:absolute;inset:22% 12%;border:3px solid #ed7628;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.28)"></div></div><div class="note" id="cameraNote">กำลังเปิดกล้อง...</div>`,foot:`<button class="btn btn-outline" data-close-modal>ปิดกล้อง</button>`});startCameraInternal()}
async function startCameraInternal(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=document.getElementById('cameraVideo');v.srcObject=cameraStream;await v.play();const note=document.getElementById('cameraNote');if(!window.BarcodeDetector){note.textContent='Browser นี้เปิดกล้องได้ แต่ไม่มี BarcodeDetector กรุณาใช้ Chrome/Edge รุ่นใหม่หรือปืนยิงบาร์โค้ด';return}const supported=await BarcodeDetector.getSupportedFormats(),detector=new BarcodeDetector({formats:supported.filter(x=>['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','data_matrix'].includes(x))});note.textContent='เล็งบาร์โค้ดให้อยู่ในกรอบ ระบบจะบันทึกและปิดกล้องอัตโนมัติ';let busy=false;cameraTimer=setInterval(async()=>{if(busy||v.readyState<2)return;busy=true;try{const codes=await detector.detect(v);if(codes[0]?.rawValue){const code=codes[0].rawValue;stopCamera();closeModal();await submitBarcode(code)}}catch{}finally{busy=false}},350)}catch(e){toast(`เปิดกล้องไม่สำเร็จ: ${e.message}`,'error');stopCamera();closeModal()}}
function stopCamera(){if(cameraTimer){clearInterval(cameraTimer);cameraTimer=null}if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}}
// ---------- Global event handling ----------
function openAdminClear(scope){
 if(!runtimeIsAdmin)return toast('เมนูนี้สำหรับผู้ดูแลระบบเท่านั้น','error');
 const config={counts:{title:'ล้างข้อมูลตรวจนับ',confirm:'CLEAR COUNTS'},transactions:{title:'ล้างข้อมูลธุรกรรม',confirm:'CLEAR TRANSACTIONS'},factory:{title:'ล้างข้อมูลทั้งหมด',confirm:'FACTORY RESET'}}[scope];if(!config)return;
 showModal({title:config.title,subtitle:'การดำเนินการนี้ไม่สามารถย้อนกลับได้',body:`<div class="banner error"><div><b>${esc(config.title)}</b><small>กรุณาดาวน์โหลด Backup ก่อนดำเนินการ ระบบจะเก็บบัญชีผู้ใช้งานไว้</small></div></div><div class="field"><label>พิมพ์ข้อความยืนยัน: <b>${config.confirm}</b></label><input id="adminClearConfirm" autocomplete="off"></div>`,foot:`<button class="btn btn-outline" data-close-modal>ยกเลิก</button><button class="btn btn-danger" id="adminClearSubmit">ยืนยันล้างข้อมูล</button>`,onOpen:()=>document.getElementById('adminClearSubmit').onclick=()=>{const confirmation=document.getElementById('adminClearConfirm').value.trim().toUpperCase();if(confirmation!==config.confirm)return toast('ข้อความยืนยันไม่ถูกต้อง','error');updateSyncUi('saving');parent.postMessage({type:'MBC_ADMIN_CLEAR',scope,confirmation},'*')}})
}
async function handleAction(action,el){const id=el.dataset.id,type=el.dataset.type,key=el.dataset.key,round=el.dataset.round;
 switch(action){
  case'open-online-users':parent.postMessage({type:'MBC_NAVIGATE',path:'/settings'},'*');break;case'download-baseline-template':downloadBaselineTemplate();break;case'choose-baseline-file':await chooseRoundBaselineFile();break;case'admin-clear-counts':openAdminClear('counts');break;case'admin-clear-transactions':openAdminClear('transactions');break;case'admin-clear-factory':openAdminClear('factory');break;
  case'go-scan':showPage('scan');break;case'export-dashboard':exportDashboard();break;case'health-check':showHealthDetails();break;
  case'new-round':openRoundForm();break;case'edit-round':openRoundForm(id);break;case'view-round':viewRound(id);break;case'start-round':startRound(id);break;case'use-round':await updateScanContext('roundId',id);showPage('scan');break;case'submit-round':submitRound(id);break;case'approve-round':approveRoundModal(id);break;case'return-round':returnRound(id);break;case'reopen-round':reopenRound(id);break;case'modal-round-results':closeModal();window._resultRoundId=id;showPage('results');break;
  case'camera-scan':startCameraScan();break;case'submit-barcode':submitBarcode();break;case'manual-qty':openManualQty();break;case'add-pack':addPack();break;case'decrease-last':decreaseLast();break;case'undo-scan':undoLastScan();break;case'scan-summary':openScanSummary();break;
  case'dismiss-unknown':hideUnknownAlert();break;case'resolve-unknown-alert':openResolveUnknown(id);break;
  case'export-results':exportResults();break;case'print-results':printPage('results');break;case'edit-count-row':openEditCount(round,key);break;case'request-recount':requestRecount(round,key);break;case'count-history':countHistory(round,key);break;
  case'export-unknowns':exportUnknowns();break;case'resolve-unknown':openResolveUnknown(id);break;case'edit-unknown':openEditUnknown(id);break;case'view-unknown':viewUnknown(id);break;
  case'new-transfer':openTransferForm();break;case'edit-transfer':openTransferForm(id);break;case'approve-transfer':approveTransfer(id);break;case'view-transfer':viewTransfer(id);break;case'print-transfer':printTransfer(id);break;case'remove-transfer-line':window._transferDraft.lines.splice(Number(el.dataset.index),1);refreshTransferLines();break;
  case'import-stock':chooseFile('.xlsx,.xls,.csv',importStockFile);break;case'export-stock':exportStock();break;case'stock-adjust':openStockAdjust();break;case'apply-stock-filter':window._stockFilter={q:document.getElementById('stockQ').value,brandId:document.getElementById('stockBrand').value,warehouseId:document.getElementById('stockWarehouse').value,conditionId:document.getElementById('stockCondition').value};renderPage('stock');break;case'clear-stock-filter':window._stockFilter={};renderPage('stock');break;
  case'download-product-template':downloadProductTemplate();break;case'import-products':chooseFile('.xlsx,.xls,.csv',importProductsFile);break;case'new-product':openProductForm();break;case'edit-product':openProductForm(id);break;case'toggle-product':toggleProduct(id);break;case'apply-product-filter':window._productFilter={q:document.getElementById('productQ').value,brandId:document.getElementById('productBrand').value};renderPage('products');break;case'clear-product-filter':window._productFilter={q:'',brandId:''};renderPage('products');break;
  case'new-master':openMasterForm(window._masterTab||'brands');break;case'edit-master':openMasterForm(type,id);break;case'toggle-master':toggleMaster(type,id);break;case'print-location-label':printLocationLabel(id);break;case'inline-new-brand':quickAddMaster('brands',el.dataset.target);break;case'inline-new-category':quickAddMaster('categories',el.dataset.target);break;
  case'new-user':parent.postMessage({type:'MBC_NAVIGATE',path:'/settings'},'*');break;
  case'export-report':exportReport();break;case'print-report':printPage('reports');break;case'apply-report-filter':window._reportFilter={...reportFilterState(),q:document.getElementById('reportQ')?.value||''};renderPage('reports');break;case'clear-report-filter':window._reportFilter={q:'',brandId:'',warehouseId:'',locationId:'',conditionId:'',sort:'warehouse'};renderPage('reports');break;
  case'export-audit':exportAudit();break;case'apply-audit-filter':window._auditFilter={q:document.getElementById('auditQ').value,userId:document.getElementById('auditUser').value,action:document.getElementById('auditAction').value};renderPage('audit');break;case'clear-audit-filter':window._auditFilter={q:'',userId:'',action:''};renderPage('audit');break;
  case'download-json-backup':downloadFullBackupJson();break;case'download-excel-backup':downloadFullBackupExcel();break;case'download-event-csv':downloadEventCSV();break;case'manual-snapshot':createSnapshot(true);renderPage('backup');break;case'choose-restore':chooseFile('.json',restoreBackupFile);break;case'choose-auto-backup':chooseAutoBackupFile();break;case'run-auto-backup':writeAutoBackup();break;case'clear-auto-backup':clearAutoBackup();break;case'restore-snapshot':restoreSnapshot(id);break;
  case'save-settings':saveSettings();break;case'test-success-sound':playTone('success');toast('ทดสอบเสียงสแกนสำเร็จ','success');break;case'test-unknown-sound':playTone('unknown');toast('ทดสอบเสียงรายการค้าง','warn');break;
 }
}
function showHealthDetails(){const issues=validateAndRepair(false);showModal({title:'ผลตรวจสุขภาพข้อมูล',subtitle:`Revision ${state.meta.revision} · Checksum ${state.meta.checksum}`,body:issues.length?`<div class="banner error"><div><b>พบ ${issues.length} ประเด็น</b><small>ควรสำรองข้อมูลก่อนแก้ไข</small></div></div><ol>${issues.map(x=>`<li style="margin:8px 0">${esc(x)}</li>`).join('')}</ol>`:`<div class="banner success"><div><b>ข้อมูลสมบูรณ์</b><small>ไม่พบ SKU/บาร์โค้ดซ้ำ การอ้างอิงที่ขาด หรือยอดติดลบ</small></div></div>`,foot:`<button class="btn btn-outline" data-close-modal>ปิด</button>`})}

document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){showPage(page.dataset.page);return}const close=e.target.closest('[data-close-modal]');if(close){closeModal();return}const act=e.target.closest('[data-action]');if(act){ensureAudio();handleAction(act.dataset.action,act).catch(err=>{console.error(err);toast(err.message||String(err),'error')});return}const reportTab=e.target.closest('[data-report-type]');if(reportTab){window._reportType=reportTab.dataset.reportType;renderPage('reports');return}const master=e.target.closest('[data-master-tab]');if(master){window._masterTab=master.dataset.masterTab;renderPage('masters');return}const ut=e.target.closest('[data-unknown-tab]');if(ut){const id=state.unknowns.find(x=>x.status==='pending'&&document.getElementById('modalSubtitle')?.textContent.includes(x.barcode))?.id;const u=byId(state.unknowns,id);if(u)setupUnknownResolve(u,ut.dataset.unknownTab)}})
document.addEventListener('change',e=>{const id=e.target.id;if(id==='scanRound'){updateScanContext('roundId',e.target.value);return}if(id==='scanWarehouse'){updateScanContext('warehouseId',e.target.value);return}if(id==='scanLocation'){updateScanContext('locationId',e.target.value);return}if(id==='scanCondition'){updateScanContext('conditionId',e.target.value);return}if(id==='resultRound'){window._resultRoundId=e.target.value;renderPage('results');return}if(id==='resultStatus'){window._resultFilter=e.target.value;renderPage('results');return}if(id==='unknownFilter'){window._unknownFilter=e.target.value;renderPage('unknowns');return}if(id==='reportRound'){window._reportRoundId=e.target.value;renderPage('reports');return}if(id==='reportBrand'){window._reportFilter={...reportFilterState(),brandId:e.target.value};renderPage('reports');return}if(id==='reportWarehouse'){const f=reportFilterState(),warehouseId=e.target.value,loc=byId(state.locations,f.locationId);window._reportFilter={...f,warehouseId,locationId:loc&&(!warehouseId||loc.warehouseId===warehouseId)?f.locationId:''};renderPage('reports');return}if(id==='reportLocation'){window._reportFilter={...reportFilterState(),locationId:e.target.value};renderPage('reports');return}if(id==='reportCondition'){window._reportFilter={...reportFilterState(),conditionId:e.target.value};renderPage('reports');return}if(id==='reportSort'){window._reportFilter={...reportFilterState(),sort:e.target.value};renderPage('reports');return}})
document.addEventListener('input',e=>{if(e.target.id==='setVolume'){const t=document.getElementById('volumeText');if(t)t.textContent=`${e.target.value}%`}})
document.addEventListener('keydown',e=>{if(e.target.id==='barcodeInput'&&e.key==='Enter'){e.preventDefault();submitBarcode()}if(e.target.id==='reportQ'&&e.key==='Enter'){e.preventDefault();window._reportFilter={...reportFilterState(),q:e.target.value};renderPage('reports')}if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open'))closeModal()})
document.getElementById('modalClose').addEventListener('click',closeModal);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('hamb').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));

function setupDropzone(){document.addEventListener('dragover',e=>{const d=e.target.closest('#restoreDrop');if(d){e.preventDefault();d.classList.add('drag')}});document.addEventListener('dragleave',e=>e.target.closest('#restoreDrop')?.classList.remove('drag'));document.addEventListener('drop',e=>{const d=e.target.closest('#restoreDrop');if(d){e.preventDefault();d.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)restoreBackupFile(f)}})}

async function hydrateDurableMirror(){if(bridgeReady)return;try{const text=await idbGet('durableState');if(!text)return;const durable=migrateState(JSON.parse(text));if(Number(durable.meta?.revision||0)>Number(state.meta?.revision||0)){state=durable;cacheState();renderShell();renderPage(currentPage)}}catch(e){console.warn('Durable cache unavailable',e)}}
function setupSync(){
 try{bc=new BroadcastChannel(CHANNEL_NAME);bc.onmessage=e=>{if(bridgeReady)return;if(e.data?.type==='state'&&e.data.source!==sessionId&&Number(e.data.revision)>Number(state.meta.revision)){state=loadState();renderShell();renderPage(currentPage)}}}catch{}
 window.addEventListener('storage',e=>{if(bridgeReady)return;if(e.key===STORAGE_KEY){const latest=loadLatestWithoutRender();if(Number(latest.meta.revision)>Number(state.meta.revision)){state=latest;renderShell();renderPage(currentPage)}}});
}
function applyRemoteState(remote,revision,updatedAt){
 const localContext=deepClone(state?.scanContext||lastLocalContext||seedState().scanContext),deviceId=state?.meta?.deviceId||localStorage.getItem('mbc_inv_device')||uid('DEV'),existingEvents=deepClone(state?.scanEvents||[]);
 const incoming=remote&&typeof remote==='object'?deepClone(remote):seedState();
 const remoteEvents=Array.isArray(incoming.scanEvents)?incoming.scanEvents:null;
 const incomingEventEpoch=incoming?.meta?.scanEventsEpoch||null,currentEventEpoch=state?.meta?.scanEventsEpoch||null;
 state=migrateState(incoming);
 state.scanEvents=remoteEvents||(incomingEventEpoch&&incomingEventEpoch!==currentEventEpoch?[]:existingEvents);
 state.users=deepClone(runtimeUsers||[]);state.currentUserId=runtimeUser?.id||'';
 state.scanContext={...state.scanContext,...localContext,counterId:runtimeUser?.id||localContext.counterId||''};
 state.meta.deviceId=deviceId;state.meta.serverRevision=Number(revision||0);state.meta.serverUpdatedAt=updatedAt||null;
 serverRevision=Number(revision||0);lastLocalContext=deepClone(state.scanContext);cacheState();
}
function applyRemoteEvent(event){if(!event?.id||state.scanEvents.some(x=>x.id===event.id))return false;state.scanEvents.push(deepClone(event));state.scanEvents.sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));cacheState();return true}
function handleBridgeMessage(event){
 const msg=event.data||{},payload=msg.payload||{};
 if(msg.type==='MBC_INIT'){
  runtimeUser=payload.currentUser?{id:payload.currentUser.id,name:payload.currentUser.full_name||payload.currentUser.email?.split('@')[0]||'ผู้ใช้งาน',email:payload.currentUser.email,role:payload.currentUser.role,accessMode:payload.accessMode,isAdmin:Boolean(payload.isAdmin),active:true}:null;
  runtimeUsers=Array.isArray(payload.users)?payload.users:[];runtimeAccessMode=payload.accessMode==='edit'?'edit':'read';runtimeIsAdmin=Boolean(payload.isAdmin);bridgeReady=true;
  applyRemoteState(payload.state,Number(payload.revision||0),payload.updatedAt||null);renderShell();showPage(location.hash.replace('#','')||currentPage||'overview');pendingEvents().length?updatePendingIndicator():updateSyncUi('saved');setTimeout(flushPendingEvents,200);return;
 }
 if(msg.type==='MBC_REMOTE_STATE'){if(Number(payload.revision||0)<=serverRevision)return;applyRemoteState(payload.state,payload.revision,payload.updatedAt);renderShell();renderPage(currentPage);updateSyncUi('saved');toast('รับข้อมูลล่าสุดจากระบบแล้ว','info');return}
 if(msg.type==='MBC_REMOTE_EVENT'){if(applyRemoteEvent(payload.event)){renderShell();renderPage(currentPage)}updateSyncUi('saved');return}
 if(msg.type==='MBC_EVENT_OK'){savePending=false;removePendingEvent(payload.event?.id);applyRemoteEvent(payload.event);renderShell();renderPage(currentPage);pendingEvents().length?updatePendingIndicator():updateSyncUi('saved');return}
 if(msg.type==='MBC_SAVE_OK'){savePending=false;removePendingEvent(payload.eventId);applyRemoteState(payload.state||state,payload.revision,payload.updatedAt);renderShell();renderPage(currentPage);updateSyncUi('saved');return}
 if(msg.type==='MBC_SAVE_CONFLICT'){savePending=false;removePendingEvent(payload.eventId);applyRemoteState(payload.state,payload.revision,payload.updatedAt);renderShell();renderPage(currentPage);updateSyncUi('error');toast(payload.message||'ข้อมูลเปลี่ยนแปลงจากผู้ใช้งานอื่น กรุณาทำรายการใหม่','warn');return}
 if(msg.type==='MBC_SAVE_ERROR'){savePending=false;updatePendingIndicator();toast(payload.message||'บันทึกข้อมูลไม่สำเร็จ','error');return}
 if(msg.type==='MBC_ADMIN_CLEAR_OK'){closeModal();if(payload.clearEvents&&state)state.scanEvents=[];applyRemoteState(payload.state,payload.revision,null);if(payload.clearEvents)state.scanEvents=[];cacheState();renderShell();showPage('overview');updateSyncUi('saved');toast('ล้างข้อมูลเรียบร้อยแล้ว','success');return}
 if(msg.type==='MBC_ADMIN_CLEAR_ERROR'){updateSyncUi('error');toast(payload.message||'ล้างข้อมูลไม่สำเร็จ','error')}
}
window.addEventListener('message',handleBridgeMessage);
function init(){
 state=loadState();state.scanContext.counterId=state.scanContext.counterId||'';lastLocalContext=deepClone(state.scanContext);
 renderShell();showPage(location.hash.replace('#','')||'overview');setupSync();setupDropzone();hydrateDurableMirror();updateSyncUi('saving');
 document.getElementById('onlineLogout').addEventListener('click',()=>parent.postMessage({type:'MBC_LOGOUT'},'*'));
 window.addEventListener('hashchange',()=>showPage(location.hash.replace('#','')||'overview'));
 window.addEventListener('error',e=>{console.error(e.error||e.message);toast(`เกิดข้อผิดพลาด: ${e.message}`,'error')});
 window.addEventListener('unhandledrejection',e=>{if(e.reason?.message==='READ_ONLY')return;console.error(e.reason);toast(`เกิดข้อผิดพลาด: ${e.reason?.message||e.reason}`,'error')});
 window.addEventListener('online',flushPendingEvents);
 parent.postMessage({type:'MBC_READY'},'*');
 setTimeout(flushPendingEvents,1200);
}
init();
</script>
